{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            Network
        {% endblock %}
    </title>

    <link rel="stylesheet"
          href="{% static 'network/styles.css' %}">

</head>

<body>

    <nav class="top-navbar">

        <a href="{% url 'index' %}"
           class="network-logo">
            Network
        </a>

        {% if user.is_authenticated %}

            <a href="{% url 'profile' user.username %}"
               class="nav-link">
                {{ user.username }}
            </a>

            <a href="{% url 'index' %}"
               class="nav-link">
                All Posts
            </a>

            <a href="{% url 'following' %}"
               class="nav-link">
                Following
            </a>

            <a href="{% url 'logout' %}"
               class="nav-link">
                Log Out
            </a>

        {% else %}

            <a href="{% url 'login' %}"
               class="nav-link">
                Log In
            </a>

            <a href="{% url 'register' %}"
               class="nav-link">
                Register
            </a>

        {% endif %}

    </nav>


    <main class="main-content">

        {% block body %}
        {% endblock %}

    </main>

</body>

</html>
